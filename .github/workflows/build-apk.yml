
name: Build PetroQuiz APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preparar Android SDK e NDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: |
          sdkmanager "platform-tools" "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653"

          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROIDAPI=33" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=24" >> "$GITHUB_ENV"

      - name: Instalar dependências de compilação
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev automake \
            build-essential ccache rsync

      - name: Instalar python-for-android
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-for-android

      - name: Preparar ficheiros do PetroQuiz
        run: |
          mkdir -p appsrc
          rsync -a ./ appsrc/ \
            --exclude='.git/' \
            --exclude='.buildozer/' \
            --exclude='.venv313/' \
            --exclude='venv/' \
            --exclude='.venv/' \
            --exclude='bin/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='appsrc/'

          test -f appsrc/main.py

      - name: Compilar APK
        run: |
          p4a apk \
            --private "$GITHUB_WORKSPACE/appsrc" \
            --package=org.thundercode.petroquiz \
            --name="PetroQuiz" \
            --version=0.1 \
            --bootstrap=sdl2 \
            --requirements=python3,kivy \
            --arch=arm64-v8a \
            --android-api=33 \
            --ndk-dir="$ANDROIDNDK"

      - name: Guardar APK
        if: success()
        run: |
          mkdir -p dist
          find . -type f -name '*.apk' \
            -not -path './.git/*' \
            -not -path './appsrc/*' \
            -exec cp {} dist/ \;
          test -n "$(ls -A dist)"

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PetroQuiz-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7
