name: PetroQuiz - Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: petroquiz-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Compilar PetroQuiz
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Obter o código do projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential \
            autoconf automake libtool \
            pkg-config cmake \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev \
            libltdl-dev \
            gettext autopoint \
            ccache

      - name: Verificar ferramentas
        run: |
          python --version
          java -version
          git --version

      - name: Instalar Buildozer e dependências Python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36"
          python -m pip install buildozer

      - name: Validar ficheiros do PetroQuiz
        run: |
          test -f main.py || {
            echo "::error::main.py não foi encontrado na raiz do projeto."
            exit 1
          }

          test -f buildozer.spec || {
            echo "::error::buildozer.spec não foi encontrado na raiz do projeto."
            exit 1
          }

          echo "Ficheiros principais encontrados."
          echo "Conteúdo da raiz:"
          ls -la

      - name: Compilar APK de depuração
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          buildozer android debug

      - name: Verificar APK gerado
        if: success()
        run: |
          mkdir -p dist
          find bin -maxdepth 1 -type f -name "*.apk" \
            -exec cp {} dist/ \;

          if ! find dist -maxdepth 1 -type f -name "*.apk" | grep -q .; then
            echo "::error::A compilação terminou sem gerar nenhum APK."
            echo "Conteúdo da pasta bin:"
            ls -la bin || true
            exit 1
          fi

          echo "APK(s) gerado(s):"
          ls -lh dist/

      - name: Guardar APK como artefacto
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PetroQuiz-Android-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Recolher informações em caso de falha
        if: failure()
        run: |
          echo "A compilação falhou."
          echo "Verifica o primeiro passo marcado a vermelho nos registos."
          echo "Versões das ferramentas:"
          python --version || true
          java -version || true
          echo "Conteúdo da pasta bin, se existir:"
          ls -lah bin/ || true
          echo "Últimos ficheiros de registo do Buildozer:"
          find .buildozer -type f -name "*.log" -print 2>/dev/null | head -20 || true
